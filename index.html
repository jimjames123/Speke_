function resetDB(){ DB = seedDB(); }

// ---- derived (live) values ----
const addedClients = () => DB.clients.length - CLIENTS_SEED.length;

const apptCount = () => 38 + DB.newBookings.length;

function scheduleLive(){
  return DB.newBookings.map(b => ({ time:b.time, guest:b.guest, treatment:b.treatment, room:b.room, therapist:b.therapist, dot:'#6a8168' })).concat(TODAY);
}
function salesLive(){
  return DB.newBookings.map(b => ({ guest:b.guest, treatment:b.treatment, amount:b.amount, receipt:b.receipt, room:b.room, tin:b.tin, tout:b.tout, therapist:b.therapist })).concat(SALES);
}

// ---- tax / EFRIS (Uganda URA) ----
// Prices are VAT-inclusive at the standard 18% rate.
const VAT_RATE = 0.18;
const vatIncl = (gross) => Math.round(gross * 18 / 118);   // VAT portion of a tax-inclusive price
const netIncl = (gross) => gross - vatIncl(gross);          // net (VAT-exclusive) portion
const BIZ = { tin: '1002458973', name: 'Calabash Wellness Ltd', device: 'EFRIS-TZ10-0447' };
function txns(){
  const nb = DB.newBookings.map(b => ({ guest:b.guest, treatment:b.treatment, gross:b.amt, receipt:b.receipt, fresh:true }));
  const seed = SALES.map(s => ({ guest:s.guest, treatment:s.treatment, gross:priceNum(s.amount), receipt:s.receipt, fresh:false }));
  return nb.concat(seed);
}

/* ---------------------------- HANDLERS (App) ------------------------- */
const App = {
  /* auth */
  login(e){
    e.preventDefault();
    const u = (document.getElementById('loginUser').value || '').trim().toLowerCase();
    const p = document.getElementById('loginPass').value || '';
    const found = USERS.find(x => x.user === u && x.pass === p);
    if (!found){ S.loginError = 'Incorrect username or password.'; render(); return false; }
    S.session = { user: found.user, name: found.name, role: found.role, title: found.title, initials: found.initials };
    LS.set(SESSION_KEY, S.session);
    S.loginError = ''; S.activeModule = 'dashboard'; S.clientView = null; S.mScreen = 'home';
    render(); return false;
  },
  logout(){ S.session = null; LS.del(SESSION_KEY); render(); },
  fillDemo(u){ document.getElementById('loginUser').value = u; document.getElementById('loginPass').value = 'spa123'; document.getElementById('loginUser').focus(); },

  /* navigation */
  setDevice(d){ S.device = d; render(); },
  setBranch(b){ S.branch = b; render(); },
  setModule(m){ if (!allowed(m)) return; S.activeModule = m; S.clientView = null; S.clientForm = null; render(); },
  setBranchPeriod(p){ S.branchPeriod = p; render(); },
  moduleAction(){
    const m = S.activeModule;
    if (m==='dashboard' || m==='appointments') App.openBooking();
    else if (m==='clients') App.openAddClient();
  },

  /* clients */
  openClient(i){ S.clientView = i; render(); },
  closeClient(){ S.clientView = null; render(); },
  setSearch(v){ S.clientSearch = v; S._focus = 'clientSearch'; render(); },
  openAddClient(){ S.clientForm = { editIndex: null }; S.formError=''; render(); },
  openEditClient(i){ S.clientForm = { editIndex: i }; S.formError=''; render(); },
  closeClientForm(){ S.clientForm = null; S.formError=''; render(); },
  saveClient(e){
    e.preventDefault();
    const g = (id) => (document.getElementById(id).value || '').trim();
    const name = g('cfName'), phone = g('cfPhone');
    if (!name || !phone){ S.formError = 'Name and phone are required.'; render(); return false; }
    const prefs = g('cfPrefs').split(',').map(s=>s.trim()).filter(Boolean);
    const fields = { name, phone, email: g('cfEmail'), tier: document.getElementById('cfTier').value,
      fav: g('cfFav') || '—', prefs, allergies: g('cfAllergies') || 'None on file', notes: g('cfNotes') || '—' };
    const idx = S.clientForm.editIndex;
    if (idx === null){
      DB.clients.push(Object.assign({ visits:0, last:'—', spend:0, joined:'Mar 2026', points:0, history:[], upcoming:[] }, fields));
      S.clientView = null;
    } else {
      Object.assign(DB.clients[idx], fields);
      S.clientView = idx;
    }
    saveDB(); S.clientForm = null; S.formError = ''; render(); return false;
  },

  /* mobile */
  goM(scr){ S.mScreen = scr; render(); },

  /* booking */
  openBooking(prefillIdx){
    Object.assign(S, { bkOpen:true, bkStep:1, bkDone:false, bkSector:null, bkService:null, bkDay:0, bkTime:null, bkTherapist:null, bkRoom:null,
      bkClient:'', bkPhone:'', bkPayment:null, bkReminder:true, _focus:null });
    if (typeof prefillIdx === 'number' && DB.clients[prefillIdx]){ S.bkClient = DB.clients[prefillIdx].name; S.bkPhone = DB.clients[prefillIdx].phone; }
    render();
  },
  closeBooking(){ S.bkOpen = false; S._focus = null; render(); },
  bkCanNext(){
    return [null, S.bkService!==null, S.bkTime!==null, (S.bkTherapist!==null && S.bkRoom!==null),
      (S.bkClient.trim()!=='' && S.bkPhone.trim()!==''), S.bkPayment!==null][S.bkStep];
  },
  bkNext(){
    if (S.bkStep===5){ if (App.bkCanNext()){ App.commitBooking(); S.bkDone=true; render(); } return; }
    if (App.bkCanNext()){ S.bkStep=Math.min(5,S.bkStep+1); S._focus=null; render(); }
  },
  bkBack(){ S.bkStep=Math.max(1,S.bkStep-1); S._focus=null; render(); },
  commitBooking(){
    const svc = SERVICES[S.bkService];
    const amt = priceNum(svc.price);
    const n = DB.newBookings.length;
    DB.newBookings.unshift({ time:S.bkTime, guest:S.bkClient, treatment:svc.name, sector:svc.sector, room:S.bkRoom, therapist:S.bkTherapist,
      amt, amount:svc.price, receipt:'RC-'+(4827+n), tin:S.bkTime, tout:'—', payment:S.bkPayment, reminder:S.bkReminder });
    saveDB();
  },
  pickSector(k){ S.bkSector=k; S.bkService=null; render(); },
  pickService(i){ S.bkService=i; render(); },
  pickDay(i){ S.bkDay=i; render(); },
  pickTime(t){ S.bkTime=t; render(); },
  pickTherapist(n){ S.bkTherapist=n; render(); },
  pickRoom(r){ S.bkRoom=r; render(); },
  pickPayment(p){ S.bkPayment=p; render(); },
  setField(f, v, id){ S[f]=v; S._focus=id; App.refreshNextBtn(); },
  toggleReminder(){ S.bkReminder=!S.bkReminder; render(); },
  refreshNextBtn(){ const b = document.getElementById('bkNextBtn'); if (b){ b.setAttribute('style', bkNextBtnStyle(App.bkCanNext())); } },
};
function bkNextBtnStyle(ok){
  return "padding:11px 22px;border:none;border-radius:11px;font:600 14px 'Instrument Sans',sans-serif;cursor:pointer;"
    + (ok ? "background:#3f5340;color:#fff;" : "background:#d8d3c8;color:#a8a396;cursor:not-allowed;");
}

/* -- Branch Performance (group) -- */
function viewBranches(){
  const period = S.branchPeriod, data = branchData();
  const vals = data.map(b => b[period]);
  const total = vals.reduce((a,b)=>a+b,0), max = Math.max.apply(null, vals);
  const top = data[vals.indexOf(max)];
  const toggle = PERIODS.map(p => `<button onclick="App.setBranchPeriod('${p}')" style="${chipStyle(period===p)}">${esc(p[0].toUpperCase()+p.slice(1))}</button>`).join('');
  const kpi = (label, value, sub, color) => `
    <div style="${CARD}padding:18px 18px 16px;">
      <div style="font-size:12px;color:#9a9488;text-transform:uppercase;letter-spacing:.8px;">${esc(label)}</div>
      <div class="serif" style="font-weight:600;font-size:26px;color:#26302a;line-height:1.1;margin-top:6px;">${esc(value)}</div>
      <div style="font-size:12px;color:${color||'#9a9488'};margin-top:4px;">${esc(sub)}</div>
    </div>`;
  const kpis = [
    kpi('Group Revenue', fmt(total), PERIOD_LABEL[period]),
    kpi('Top Branch', top.name, fmt(top[period]), '#5a7a52'),
    kpi('Group VAT @ 18%', fmt(vatIncl(total)), 'Payable to URA'),
    kpi('Branches', '3', 'Wampewo · Munyonyo · Bukoto'),
  ].join('');
  const bars = data.map(b => {
    const h = max ? Math.round(b[period]/max*100) : 0;
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;">
      <div style="font-size:12px;color:#7a6f57;font-weight:600;">${esc(fmt(b[period]))}</div>
      <div style="width:100%;max-width:110px;height:${h}%;background:linear-gradient(#7d9179,#5a6f57);border-radius:10px 10px 0 0;"></div>
      <div style="font-size:12.5px;color:#26302a;font-weight:600;">${esc(b.name)}</div>
    </div>`;
  }).join('');
  const rows = data.slice().sort((a,b)=>b[period]-a[period]).map((b,i) => {
    const share = total ? (b[period]/total*100).toFixed(1) : '0.0';
    const tCol = b.trend>=0 ? '#5a7a52' : '#b0492a';
    const measure = period==='daily' ? (b.appts + ' appts') : (b.members + ' members');
    return `<tr style="border-top:1px solid #f0ede6;">
      <td style="padding:12px 6px;font-size:13px;color:#9a9488;width:28px;">${i+1}</td>
      <td style="padding:12px 6px;font-size:13.5px;color:#2a2824;font-weight:500;">${esc(b.name)}</td>
      <td style="padding:12px 6px;font-size:13px;color:#3f5340;font-weight:600;">${esc(fmt(b[period]))}</td>
      <td style="padding:12px 6px;font-size:12.5px;color:#6b665d;">${share}%</td>
      <td style="padding:12px 6px;font-size:12.5px;color:#6b665d;">${esc(measure)}</td>
      <td style="padding:12px 6px;font-size:12.5px;color:${tCol};font-weight:600;text-align:right;">${b.trend>=0?'▲':'▼'} ${Math.abs(b.trend)}%</td>
    </tr>`;
  }).join('');
  const th = (t, extra='') => `<th style="font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:#9a9488;font-weight:600;padding:8px 6px;text-align:left;${extra}">${t}</th>`;
  return `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;">${toggle}</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px;">${kpis}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;">
      <div style="${CARD}padding:22px;">
        <div style="font-weight:600;font-size:15px;color:#26302a;margin-bottom:20px;">Revenue by branch · ${esc(PERIOD_LABEL[period])}</div>
        <div style="display:flex;align-items:flex-end;gap:26px;height:210px;padding:0 8px;">${bars}</div>
      </div>
      <div style="${CARD}padding:8px 20px 16px;">
        <div style="padding:14px 0;font-weight:600;font-size:15px;color:#26302a;">League table · ${esc(PERIOD_LABEL[period])}</div>
        <table style="width:100%;border-collapse:collapse;">
          <thead><tr>${th('#')}${th('Branch')}${th('Revenue')}${th('Share')}${th('Activity')}${th('vs last', 'text-align:right;')}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function moduleBody(){
  if (!allowed(S.activeModule)) S.activeModule = 'dashboard';
  switch (S.activeModule){
    case 'dashboard': return viewDashboard();
    case 'appointments': return viewAppointments();
    case 'clients': return viewClients();
    case 'billing': return viewBilling();
    case 'taxes': return viewTaxes();
    case 'branches': return viewBranches();
    case 'inventory': return viewInventory();
    case 'staff': return viewStaff();
    case 'marketing': return viewMarketing();
    case 'analytics': return viewAnalytics();
    case 'reports': return viewReports();
    case 'gym': return viewGym();
    default: return viewDashboard();
  }
}

function bookingStepper(){
  return BK_STEP_LABELS.map((label, i) => {
    const n = i+1, on = S.bkStep===n, done = S.bkStep>n;
    const numStyle = "width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;"
      + (on ? "background:#3f5340;color:#fff;" : done ? "background:#c9b491;color:#4a3f2a;" : "background:#eae6dd;color:#9a9488;");
    const labelStyle = "font-size:12.5px;font-weight:" + (on?'600':'500') + ";color:" + (on?'#26302a':'#9a9488') + ";";
    const conn = i < BK_STEP_LABELS.length-1 ? '<div style="flex:1;height:1px;background:#e2ddd3;min-width:14px;"></div>' : '';
    return `<div style="display:flex;align-items:center;gap:8px;"><div style="${numStyle}">${done?'✓':n}</div><div style="${labelStyle}">${esc(label)}</div></div>${conn}`;
  }).join('');
}
function bookingStepBody(){
  if (S.bkStep === 1){
    const chips = SECTORS.map(sec => `
      <button onclick="App.pickSector('${sec.key}')" style="${chipStyle(S.bkSector===sec.key)}" title="${esc(sec.desc)}">${esc(sec.label)}</button>`).join('');
    let list;
    if (!S.bkSector){
      list = `<div style="font-size:13px;color:#9a9488;padding:16px 2px;">Choose a sector above to see its ${''}services and packages.</div>`;
    } else {
      const items = SERVICES.map((sv,gi) => ({ sv, gi })).filter(({sv}) => sv.sector === S.bkSector);
      const heading = S.bkSector === 'all' ? 'All-access packages' : SECTOR_LABEL[S.bkSector] + ' services';
      list = `<div style="font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#9a9488;margin:18px 0 9px;">${esc(heading)}</div>
        <div style="display:flex;flex-direction:column;gap:9px;">`
        + items.map(({sv,gi}) => `<button onclick="App.pickService(${gi})" style="${optStyle(S.bkService===gi)}"><span>${esc(sv.name)}</span><span style="color:#7a6f57;font-weight:600;white-space:nowrap;">${esc(sv.price)}</span></button>`).join('')
        + `</div>`;
    }
    return `<div style="font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#9a9488;margin-bottom:9px;">Which part of the club?</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">${chips}</div>${list}`;
  }
  if (S.bkStep === 2){
    const days = BK_DAYS.map((d, i) => `<button onclick="App.pickDay(${i})" style="${chipStyle(S.bkDay===i)}">${esc(d)}</button>`).join('');
    const times = BK_TIMES.map(tt => {
      const taken = tt==='11:30' || tt==='16:00';
      const st = taken ? "padding:9px 15px;border-radius:10px;border:1px dashed #e2ddd3;background:#f4f1ea;color:#c2bcaf;font:500 13px 'Instrument Sans',sans-serif;cursor:not-allowed;white-space:nowrap;" : chipStyle(S.bkTime===tt);
      return `<button ${taken?'disabled':''} onclick="${taken?'':`App.pickTime('${tt}')`}" style="${st}">${taken?tt+' · full':tt}</button>`;
    }).join('');
    return `
      <div style="font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#9a9488;margin-bottom:9px;">Choose a day</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;">${days}</div>
      <div style="font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#9a9488;margin-bottom:9px;">Available times</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">${times}</div>`;
  }
  if (S.bkStep === 3){
    const th = BK_THERAPISTS.map(n => `
      <button onclick="App.pickTherapist('${esc(n)}')" style="${optStyle(S.bkTherapist===n)}">
        <span style="display:flex;align-items:center;gap:10px;"><span style="width:28px;height:28px;border-radius:50%;background:#eae4d7;color:#7a6f57;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;">${esc(initials(n))}</span>${esc(n)}</span>
      </button>`).join('');
    const rooms = BK_ROOMS.map(r => `<button onclick="App.pickRoom('${esc(r)}')" style="${chipStyle(S.bkRoom===r)}">${esc(r)}</button>`).join('');
    return `
      <div style="font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#9a9488;margin-bottom:9px;">Assign therapist</div>
      <div style="display:flex;flex-direction:column;gap:9px;margin-bottom:20px;">${th}</div>
      <div style="font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#9a9488;margin-bottom:9px;">Assign room</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">${rooms}</div>`;
  }
  if (S.bkStep === 4){
    return `
      <div style="display:flex;flex-direction:column;gap:16px;">
        <div><label class="lbl" for="bkClient">Client name</label>
          <input id="bkClient" class="fld" value="${esc(S.bkClient)}" oninput="App.setField('bkClient', this.value, 'bkClient')" placeholder="e.g. Aisha Kembabazi"></div>
        <div><label class="lbl" for="bkPhone">Phone number</label>
          <input id="bkPhone" class="fld" value="${esc(S.bkPhone)}" oninput="App.setField('bkPhone', this.value, 'bkPhone')" placeholder="+256 7xx xxx xxx"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;background:#f7f5f0;border:1px solid #eae4d7;border-radius:12px;padding:14px 16px;">
          <div><div style="font-size:13.5px;color:#26302a;font-weight:500;">Send SMS reminder</div><div style="font-size:12px;color:#9a9488;">24 hours before the appointment</div></div>
          <div onclick="App.toggleReminder()" style="width:44px;height:24px;border-radius:14px;padding:2px;cursor:pointer;display:flex;${S.bkReminder?'background:#3f5340;justify-content:flex-end;':'background:#d8d3c8;justify-content:flex-start;'}"><div style="width:20px;height:20px;border-radius:50%;background:#fff;"></div></div>
        </div>
      </div>`;
  }
  const service = S.bkService!==null ? SERVICES[S.bkService].name : '—';
  const price = S.bkService!==null ? SERVICES[S.bkService].price : '—';
  const sector = S.bkService!==null ? SECTOR_LABEL[SERVICES[S.bkService].sector] : '—';
  const row = (l, v) => `<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0ede6;font-size:13.5px;"><span style="color:#9a9488;">${l}</span><span style="color:#26302a;font-weight:500;text-align:right;">${esc(v)}</span></div>`;
  if (S.bkDone){
    return `
      <div style="text-align:center;padding:24px 10px;">
        <div style="width:64px;height:64px;border-radius:50%;background:#eef2ec;color:#3f5340;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 16px;">✓</div>
        <div class="serif" style="font-size:24px;color:#26302a;">Booking Confirmed</div>
        <div style="font-size:13.5px;color:#8f897e;margin-top:8px;line-height:1.5;">${esc(sector)} · ${esc(service)} for ${esc(S.bkClient||'the client')}<br>${esc(BK_DAYS[S.bkDay||0])} March 2026 · ${esc(S.bkTime||'—')} · ${esc(S.bkRoom||'—')}</div>
        <div style="font-size:12.5px;color:#6a8168;margin-top:10px;">Added to Today's Schedule &amp; Billing.${S.bkReminder?' An SMS reminder will be sent 24h before.':''}</div>
      </div>`;
  }
  return `
    <div style="${CARD}padding:6px 18px;">
      ${row('Sector', sector)}${row('Service', service)}${row('Price', price)}${row('Date', BK_DAYS[S.bkDay||0] + ' March 2026')}${row('Time', S.bkTime || '—')}
      ${row('Therapist', S.bkTherapist || '—')}${row('Room', S.bkRoom || '—')}${row('Client', S.bkClient || '—')}${row('Phone', S.bkPhone || '—')}${row('Branch', 'The Calabash ' + S.branch)}
    </div>
    <div style="font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#9a9488;margin:18px 0 9px;">Payment method</div>
    <div style="display:flex;flex-direction:column;gap:9px;">
      ${BK_PAYMENTS.map(p => `<button onclick="App.pickPayment('${esc(p)}')" style="${optStyle(S.bkPayment===p)}"><span>${esc(p)}</span></button>`).join('')}
    </div>`;
}
function bookingModal(){
  if (!S.bkOpen) return '';
  const ok = App.bkCanNext();
  const footer = S.bkDone
    ? `<button onclick="App.closeBooking()" style="${bkNextBtnStyle(true)}">Done</button>`
    : `${S.bkStep>1 ? `<button onclick="App.bkBack()" style="padding:11px 20px;border:1px solid #ddd7cb;background:#fff;border-radius:11px;font:600 14px 'Instrument Sans',sans-serif;color:#4a4740;cursor:pointer;">Back</button>` : '<div></div>'}
      <button id="bkNextBtn" onclick="App.bkNext()" style="${bkNextBtnStyle(ok)}">${S.bkStep===5?'Confirm Booking':'Continue'}</button>`;
  return `
    <div onclick="App.closeBooking()" style="position:fixed;inset:0;background:rgba(30,28,24,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;">
      <div onclick="event.stopPropagation()" style="width:560px;max-width:100%;max-height:90vh;background:#faf8f4;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 70px rgba(30,28,24,.32);">
        <div style="padding:20px 24px;border-bottom:1px solid #eae4d7;display:flex;align-items:center;justify-content:space-between;">
          <div class="serif" style="font-size:21px;color:#26302a;">New Booking</div>
          <button onclick="App.closeBooking()" style="width:30px;height:30px;border:none;background:#f0ede6;border-radius:8px;color:#6b665d;font-size:16px;cursor:pointer;">✕</button>
        </div>
        ${S.bkDone ? '' : `<div style="padding:16px 24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid #f0ede6;">${bookingStepper()}</div>`}
        <div style="padding:22px 24px;overflow:auto;flex:1;">${bookingStepBody()}</div>
        <div style="padding:16px 24px;border-top:1px solid #eae4d7;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f4f1ea;">${footer}</div>
      </div>
    </div>`;
}

/* ----------------------------- MOBILE -------------------------------- */
function mobileHome(){
  const first = (S.session.name||'').split(' ')[0];
  const appts = scheduleLive().slice(0,4).map(a => `
    <div style="${CARD}padding:12px 14px;margin-bottom:9px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="font-size:13px;font-weight:600;color:#3f5340;">${esc(a.time)}</div>
        <div style="width:7px;height:7px;border-radius:50%;background:${a.dot};"></div>
        <div style="flex:1;"><div style="font-size:13px;color:#2a2824;font-weight:500;">${esc(a.guest)}</div><div style="font-size:11.5px;color:#9a9488;">${esc(a.treatment)}</div></div>
      </div>
    </div>`).join('');
  return `
    <div class="serif" style="font-size:26px;color:#26302a;margin:6px 0 2px;">Good morning, ${esc(first)}</div>
    <div style="font-size:12.5px;color:#9a9488;margin-bottom:16px;">Friday, 21 March · Morning shift</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
      <div style="background:#26302a;color:#fff;border-radius:16px;padding:16px;"><div style="font-size:11px;color:#9fb09b;text-transform:uppercase;letter-spacing:.5px;">Revenue</div><div class="serif" style="font-size:26px;margin-top:4px;">${(revenueTotal()/1e6).toFixed(2)}M</div></div>
      <div style="${CARD}padding:16px;"><div style="font-size:11px;color:#9a9488;text-transform:uppercase;letter-spacing:.5px;">Bookings</div><div class="serif" style="font-size:26px;color:#26302a;margin-top:4px;">${apptCount()}</div></div>
    </div>
    <div style="font-size:13px;font-weight:600;color:#26302a;margin-bottom:8px;">Next appointments</div>${appts}`;
}
function mobileBook(){
  const svcs = MENU.slice(0,6).map(m => `
    <button onclick="App.openBooking()" style="width:100%;text-align:left;${CARD}padding:14px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;">
      <span style="font-size:13.5px;color:#2a2824;">${esc(m.name)}</span><span style="font-size:12.5px;color:#7a6f57;font-weight:600;white-space:nowrap;">${esc(m.price)}</span>
    </button>`).join('');
  return `
    <div class="serif" style="font-size:24px;color:#26302a;margin:6px 0 4px;">Book a Service</div>
    <div style="font-size:12.5px;color:#9a9488;margin-bottom:16px;">Tap a service to start a booking</div>
    <button onclick="App.openBooking()" style="width:100%;padding:13px;border:none;background:#3f5340;color:#fff;border-radius:13px;font:600 14px 'Instrument Sans',sans-serif;cursor:pointer;margin-bottom:16px;">+ New Booking</button>${svcs}`;
}
function mobileStaff(){
  const shift = ON_SHIFT.map(s => `
    <div style="${CARD}padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;gap:10px;">
      <div style="width:32px;height:32px;border-radius:50%;background:#eae4d7;color:#7a6f57;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;">${esc(s.initials)}</div>
      <div style="flex:1;"><div style="font-size:13px;color:#2a2824;">${esc(s.name)}</div><div style="font-size:11.5px;color:#9a9488;">${esc(s.role)}</div></div>
      <div style="font-size:11.5px;color:#6a8168;">${esc(s.shift)}</div>
    </div>`).join('');
  return `<div class="serif" style="font-size:24px;color:#26302a;margin:6px 0 4px;">On Shift Now</div><div style="font-size:12.5px;color:#9a9488;margin-bottom:16px;">${RAW_STAFF.length} team members · Wampewo</div>${shift}`;
}
function mobile(){
  const screen = S.mScreen==='home' ? mobileHome() : S.mScreen==='book' ? mobileBook() : mobileStaff();
  const tab = (scr, label, icon) => `<button onclick="App.goM('${scr}')" style="${mTabStyle(S.mScreen===scr)}"><div style="font-size:16px;line-height:1;">${icon}</div><div style="margin-top:3px;">${label}</div></button>`;
  return `
    <div style="width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:34px 0 60px;background:#e7e3da;">
      <div style="width:390px;max-width:100%;height:800px;background:#20261f;border-radius:44px;padding:12px;box-shadow:0 30px 70px rgba(30,28,24,.28);">
        <div style="width:100%;height:100%;background:#f4f1ea;border-radius:33px;overflow:hidden;position:relative;display:flex;flex-direction:column;">
          <div style="height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12.5px;font-weight:600;color:#26302a;flex-shrink:0;"><span>9:41</span><span>Wampewo Spa</span><span>100%</span></div>
          <div style="flex:1;overflow:auto;padding:6px 18px 20px;">${screen}</div>
          <div style="flex-shrink:0;background:#fbfaf7;border-top:1px solid #eae4d7;padding:8px 14px 14px;display:flex;gap:6px;">${tab('home','Home','⌂')}${tab('book','Book','＋')}${tab('staff','Staff','☰')}</div>
        </div>
      </div>
    </div>`;
}

/* ------------------------------ RENDER ------------------------------- */
function render(){
  const root = document.getElementById('root');
  if (!S.session){
    root.innerHTML = loginView();
    const el = document.getElementById('loginUser'); if (el) el.focus();
    return;
  }
  const body = S.device==='desktop' ? desktop() : mobile();
  root.innerHTML = `
    <div style="width:100%;min-height:100vh;background:#e7e3da;display:flex;flex-direction:column;align-items:center;padding:0;">
      ${topBar()}${body}
    </div>
    ${bookingModal()}${clientFormModal()}`;
  if (S._focus){ const el = document.getElementById(S._focus); if (el){ el.focus(); const v = el.value; el.value=''; el.value=v; } S._focus = null; }
}

render();
</script>
</body>
</html>
